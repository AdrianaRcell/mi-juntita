<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7eef8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Juntita">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Mi Juntita</title>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div id="decor" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">✿</div>
      <div><strong>Mi Juntita</strong><span>poquito a poquito ♡</span></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Cambiar tema">☾</button>
      <button class="icon-btn bell-btn" id="notifyBtn" title="Notificaciones">♧<i id="notifDot"></i></button>
      <button class="icon-btn share-main" id="shareBtn" title="Compartir">↗</button>
    </div>
  </header>

  <main class="shell">
    <section class="welcome stagger">
      <div>
        <p class="eyebrow">TU DINERITO, EN ORDEN</p>
        <h1>Hola ♡</h1>
        <p class="muted">Tus juntitas y pendientes, sin complicarte.</p>
      </div>
      <button class="soft-btn settings-btn" id="settingsBtn">⚙️ Configuración</button>
    </section>

    <section id="juntasGrid" class="cards-grid"></section>

    <section class="quick-grid stagger">
      <button class="action-card junta-action" id="newJuntaBtn">
        <span class="action-icon">🌸</span><span><b>Agregar Junta</b><small>Crear una meta</small></span><em>＋</em>
      </button>
      <button class="action-card kelly-action" id="kellyBtn" aria-hidden="true" tabindex="-1">
        <span class="action-icon">💗</span><span><b>Registrar Kelly</b><small>Agregar un pago</small></span><em>＋</em>
      </button>
      <button class="action-card gasto-action" id="gastoBtn">
        <span class="action-icon">🪙</span><span><b>Agregar gasto</b><small>Sin comprobante</small></span><em>＋</em>
      </button>
    </section>

    <section class="lower-grid">
      <article class="panel stagger" id="expensesPanel"></article>
      <article class="panel stagger" id="tasksPanel"></article>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Generic modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
