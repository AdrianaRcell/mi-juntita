<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7eef8">
  <meta name="description" content="Mi Juntita: tus juntitas, ahorros, deudas y comprobantes en un solo lugar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Juntita">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Mi Juntita</title>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div id="decor" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">✿</div>
      <div>
        <strong>Mi Juntita</strong>
        <span id="savingPhrase">Ahorrar hoy, respirar mañana ♡</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" type="button" title="Cambiar tema">☾</button>
      <button class="icon-btn bell-btn" id="notifyBtn" type="button" title="Notificaciones">♧<i id="notifDot"></i></button>
      <button class="icon-btn mj-refresh-btn" id="mjRefreshBtn" type="button" title="Actualizar datos" aria-label="Actualizar datos">↻</button>
            <button class="icon-btn share-main" id="shareBtn" type="button" title="Compartir">↗</button>
    </div>
  </header>

  <main class="shell">
    <section class="welcome stagger">
      <div>
        <p class="eyebrow">TU DINERITO, EN ORDEN</p>
        <h1>Hola ♡</h1>
        <p class="muted">Tus juntitas y pendientes, sin complicarte.</p>
      </div>

      <button class="soft-btn settings-btn" id="settingsBtn" type="button">⚙️ Configuración</button>
    </section>

    <section id="juntasGrid" class="cards-grid"></section>

    <section class="quick-grid stagger">
      <button class="action-card junta-action" id="newJuntaBtn" type="button">
        <span class="action-icon">🌸</span>
        <span><b>Agregar Junta</b><small>Crear una meta</small></span>
        <em>＋</em>
      </button>

      <button class="action-card kelly-action" id="kellyBtn" type="button" hidden aria-hidden="true" tabindex="-1">
        <span class="action-icon">💗</span>
        <span><b>Registrar Kelly</b><small>Agregar un pago</small></span>
        <em>＋</em>
      </button>

      <button class="action-card gasto-action" id="gastoBtn" type="button">
        <span class="action-icon">🪙</span>
        <span><b>Agregar gasto</b><small>Sin comprobante</small></span>
        <em>＋</em>
      </button>
    </section>

    <section class="lower-grid">
      <article class="panel stagger" id="expensesPanel"></article>
      <article class="panel stagger" id="tasksPanel"></article>
    </section>
  </main>

  <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="test-mode.js"></script>
  <script src="share-guard.js"></script>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const hash = location.hash.replace(/^#/, "");
      const hashParams = new URLSearchParams(hash);
      const shared = !!(params.get("share") || hashParams.get("share"));

      window.MiJuntitaSharedMode = shared;

      if (!shared) {
        document.write('<script src="app.js"><\/script>');
      }
    })();
  </script>

  <script src="enhancements.js"></script>
  <script src="reminders.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", { scope: "./" })
          .then(() => console.log("Mi Juntita: PWA activada"))
          .catch((error) => console.warn("Mi Juntita: no se pudo activar la PWA.", error));
      });
    }
  </script>
</body>
</html>
